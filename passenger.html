<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Bus</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#15171B; --ink-2:#1E2229; --ink-3:#2E333B;
  --signal:#FFB400; --live:#39B36B; --stale:#D2453F; --info:#3B82F6;
  --dim:#8B9099;
  --sans:"Barlow Condensed",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:var(--sans);background:var(--ink);color:#fff;
     display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button{font-family:var(--sans);font-size:17px;font-weight:600;border:none;border-radius:3px;
       padding:14px 16px;width:100%;background:var(--signal);color:var(--ink);cursor:pointer;
       touch-action:manipulation}
button:active{transform:scale(.985)}
button.ghost{background:var(--ink-2);color:#fff;border:1px solid var(--ink-3)}
button.danger{background:var(--stale);color:#fff}
input{font-family:var(--sans);font-size:17px;padding:14px;width:100%;border-radius:3px;
      border:1px solid var(--ink-3);background:var(--ink-2);color:#fff}
input:focus{outline:2px solid var(--signal);outline-offset:-1px}

#gate{position:fixed;inset:0;z-index:4000;background:var(--ink);
      display:flex;align-items:center;justify-content:center;padding:26px}
.card{width:100%;max-width:330px}
.mark{font-family:var(--mono);font-size:12px;color:var(--signal);letter-spacing:.2em;margin-bottom:8px}
.card h1{font-size:36px;font-weight:600;line-height:1;margin-bottom:8px}
.card p{font-size:16px;color:var(--dim);margin-bottom:22px;line-height:1.45}
.card input{margin-bottom:11px}
.err{font-size:15px;color:#FF8A80;min-height:22px;margin-top:10px}

header{flex:0 0 auto;display:flex;align-items:center;gap:10px;
       padding:calc(11px + env(safe-area-inset-top)) 15px 11px;border-bottom:1px solid var(--ink-3)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--stale);flex:0 0 auto}
.dot.on{background:var(--live);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(57,179,107,.55)}
                 70%{box-shadow:0 0 0 7px rgba(57,179,107,0)}
                 100%{box-shadow:0 0 0 0 rgba(57,179,107,0)}}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}}
header h1{flex:1;font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .st{font-family:var(--mono);font-size:12px;color:var(--dim)}
header button{width:auto;background:none;color:var(--dim);font-weight:400;font-size:14px;padding:5px 7px}

#wrap{position:relative;flex:1 1 auto;min-height:0}
#map{position:absolute;inset:0;background:#20242B}
.leaflet-control-attribution{font-size:9px}
.bus{width:38px;height:38px;display:grid;place-items:center;background:var(--signal);
     border:3px solid var(--ink);border-radius:50%;box-shadow:0 3px 12px rgba(0,0,0,.45)}
.bus svg{width:18px;height:18px;fill:var(--ink)}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 3px;transform:rotate(45deg);
     background:var(--info);border:2.5px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.45)}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:600;
       display:none;pointer-events:none;font-size:40px;line-height:1;color:var(--info);
       text-shadow:0 2px 5px rgba(0,0,0,.55)}
#banner{position:absolute;left:12px;right:12px;top:12px;z-index:700;display:none;
        border-radius:4px;padding:12px 14px;font-size:16px;font-weight:600;
        box-shadow:0 4px 16px rgba(0,0,0,.4)}
#banner.info{background:var(--info);color:#fff}
#banner.note{background:#FFF4D6;color:#5C4813;font-weight:400;font-size:15px;line-height:1.45}

#sheet{flex:0 0 auto;border-top:1px solid var(--ink-3);
       padding:14px 15px calc(14px + env(safe-area-inset-bottom));
       display:flex;flex-direction:column;gap:9px}
.big{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--signal);
     text-align:center;padding:2px 0}
.status{font-family:var(--mono);font-size:15px;color:var(--dim);text-align:center;line-height:1.5}
.two{display:flex;gap:9px}
.two button{flex:1}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="mark">BUS</div>
    <h1>Welcome</h1>
    <p>Enter your name and phone so the driver knows who to pick up.</p>
    <input id="gname" placeholder="Your name" autocomplete="name">
    <input id="gphone" type="tel" placeholder="Phone number" autocomplete="tel" inputmode="tel">
    <button id="gbtn">Continue</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<header>
  <span class="dot" id="dot"></span>
  <h1>Bus</h1>
  <span class="st" id="state">connecting</span>
  <button id="out">Change</button>
</header>

<div id="wrap">
  <div id="banner"></div>
  <div id="cross">&#9679;</div>
  <div id="map"></div>
</div>

<div id="sheet">
  <div class="big" id="big">Bus location</div>
  <div class="status" id="status">Finding the bus…</div>

  <div id="idle">
    <button id="gpsBtn">Send my current location</button>
    <button class="ghost" id="reqBtn" style="margin-top:9px">Choose a spot on the map</button>
  </div>

  <div id="placing" style="display:none">
    <div class="status" style="margin-bottom:9px">Drag the map so the blue dot is on your spot.</div>
    <div class="two">
      <button class="ghost" id="cancelPlace">Cancel</button>
      <button id="confirmPlace">Pick me up here</button>
    </div>
  </div>

  <div id="waiting" style="display:none">
    <button class="danger" id="cancelReq">Cancel my request</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  if (typeof L === "undefined")
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>');
</script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script>
  if (typeof firebase === "undefined")
    document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"><\/script>');
</script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
  if (typeof firebase !== "undefined" && !firebase.database)
    document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-database-compat.js"><\/script>');
</script>

<script>
/* ===================== settings ===================== */
const DB_URL      = "https://buss1-fd9da-default-rtdb.firebaseio.com";
const OFFLINE_MS  = 180000;
const PLACEHOLDER = { lat: 40.7128, lng: -74.0060 };
const START_VIEW  = [34.436, 35.850];
/* ==================================================== */

const $ = id => document.getElementById(id);

/* On a phone there is no console, so any script error is shown on screen. */
window.onerror = function (m, src, line) {
  const box = document.getElementById("gerr");
  if (box) box.textContent = "Error: " + m + " (line " + line + ")";
  return false;
};

function banner(t, kind, ms) {
  const b = $("banner");
  b.className = kind || "info"; b.textContent = t; b.style.display = "block";
  if (ms) setTimeout(() => { b.style.display = "none"; }, ms);
}

if (typeof firebase === "undefined") {
  document.body.innerHTML = '<div style="padding:36px;font-family:system-ui;color:#fff;line-height:1.7">' +
    '<h2>Firebase did not load</h2><p>Check your connection or an ad blocker.</p></div>';
  throw new Error("no sdk");
}
firebase.initializeApp({ databaseURL: DB_URL });
const db = firebase.database();

/* remembers you between visits; falls back quietly when storage is blocked */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ===================== sign in ===================== */
let myName = "", myPhone = "", myKey = "";

$("gbtn").onclick = () => {
  const n = $("gname").value.trim();
  const p = $("gphone").value.trim();
  $("gerr").textContent = "";

  if (n.length < 2)  { $("gerr").textContent = "Please enter your name."; return; }
  const digits = p.replace(/\D/g, "");
  if (digits.length < 6) { $("gerr").textContent = "Please enter a valid phone number."; return; }

  store.set("bus_name", n);
  store.set("bus_phone", p);
  enter(n, p);
};
$("gphone").addEventListener("keydown", e => { if (e.key === "Enter") $("gbtn").click(); });

$("out").onclick = () => {
  if (myKey) db.ref("requests/" + myKey).remove().catch(() => {});
  store.del("bus_name"); store.del("bus_phone");
  location.reload();
};

function enter(name, phone) {
  myName = name; myPhone = phone;
  myKey  = String(phone).replace(/\D/g, "");

  if (typeof L === "undefined") {
    $("gerr").textContent = "The map library did not load. Check your connection and reload.";
    return;
  }

  $("gate").style.display = "none";

  try {
    startMap();
    if (!started) { started = true; watchBus(); watchMine(); }
  } catch (e) {
    /* The map is up and you are signed in, so stay on the map and report it
       there rather than throwing you back to the login screen. */
    banner("Something went wrong: " + e.message, "note", 10000);
  }
}

/* auto sign-in if we already know them */
(function () {
  const n = store.get("bus_name"), p = store.get("bus_phone");
  if (n && p) enter(n, p);
})();

/* ===================== map ===================== */
let map, busMarker, myPin, started = false;

function startMap() {
  if (map) { setTimeout(() => map.invalidateSize(), 150); return; }   // never build it twice
  map = L.map("map", { zoomControl:false }).setView(START_VIEW, 14);
  L.control.zoom({ position:"topright" }).addTo(map);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
              { maxZoom:19, attribution:"&copy; OpenStreetMap" }).addTo(map);
  setTimeout(() => map.invalidateSize(), 250);
}

const busIcon = L.divIcon({ className:"",
  html:'<div class="bus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></div>',
  iconSize:[38,38], iconAnchor:[19,19] });
const pinIcon = L.divIcon({ className:"", html:'<div class="pin"></div>',
  iconSize:[28,28], iconAnchor:[14,28] });

/* ===================== bus ===================== */
function flatten(logs) {
  const out = [];
  if (!logs) return out;
  Object.entries(logs).forEach(([key, val]) => {
    if (!val || typeof val !== "object") return;
    if (typeof val.latitude === "number") {
      out.push({ ts: val.timestamp || Number(key) || 0, lat: val.latitude, lng: val.longitude });
      return;
    }
    Object.entries(val).forEach(([ms, p]) => {
      if (p && typeof p.latitude === "number")
        out.push({ ts:Number(ms) || 0, lat:p.latitude, lng:p.longitude });
    });
  });
  return out.filter(p => p.ts > 0 &&
      !(Math.abs(p.lat-PLACEHOLDER.lat) < 5e-4 && Math.abs(p.lng-PLACEHOLDER.lng) < 5e-4))
    .sort((a,b) => a.ts - b.ts);
}

const two = n => String(n).padStart(2,"0");
const clock = ts => { const d = new Date(ts); return two(d.getHours())+":"+two(d.getMinutes()); };
function ago(ms) {
  const s = Math.round(ms/1000);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " d ago";
}

let centred = false;

function watchBus() {
  db.ref("devices").on("value", s => {
    const devs = s.val() || {};
    const ids = Object.keys(devs);
    if (!ids.length) { $("state").textContent = "no tracker"; return; }

    const pts = flatten(devs[ids[0]].logs);
    if (!pts.length) { $("state").textContent = "no fix yet"; return; }

    const last = pts[pts.length-1];
    const live = Date.now() - last.ts < OFFLINE_MS;

    $("dot").className = "dot" + (live ? " on" : "");
    $("state").textContent = live ? "live" : "not reporting";
    $("status").textContent = "Bus seen at " + clock(last.ts) + " · " + ago(Date.now()-last.ts);

    if (!busMarker) busMarker = L.marker([last.lat,last.lng], { icon:busIcon, zIndexOffset:400 }).addTo(map);
    else busMarker.setLatLng([last.lat,last.lng]);
    busMarker.setOpacity(live ? 1 : .5);

    if (!centred) { map.setView([last.lat,last.lng], 16); centred = true; }
  }, e => banner(/permission/i.test(e.message)
      ? "The database is blocking reads. Set \".read\": true in the rules."
      : "Database error: " + e.message, "note"));
}

/* ===================== my request ===================== */
let placing = false;

function watchMine() {
  db.ref("requests/" + myKey).on("value", s => {
    const r = s.val();
    const waiting = r && r.status === "waiting";

    if (waiting) {
      if (!myPin) myPin = L.marker([r.lat,r.lng], { icon:pinIcon }).addTo(map).bindPopup("Your pickup spot");
      else myPin.setLatLng([r.lat,r.lng]);
    } else if (myPin) {
      map.removeLayer(myPin); myPin = null;
    }

    if (!placing) {
      $("idle").style.display    = waiting ? "none" : "block";
      $("waiting").style.display = waiting ? "block" : "none";
      $("big").textContent = waiting ? "Pickup requested" : "Bus location";
    }
  }, e => console.warn(e.message));
}

function setPlacing(on) {
  placing = on;
  $("cross").style.display   = on ? "block" : "none";
  $("placing").style.display = on ? "block" : "none";
  $("idle").style.display    = on ? "none" : "block";
  $("waiting").style.display = "none";
  if (!on) db.ref("requests/" + myKey).once("value").then(s => {
    const waiting = s.val() && s.val().status === "waiting";
    $("idle").style.display    = waiting ? "none" : "block";
    $("waiting").style.display = waiting ? "block" : "none";
  });
}

$("reqBtn").onclick      = () => setPlacing(true);
$("cancelPlace").onclick = () => setPlacing(false);

$("confirmPlace").onclick = () => {
  const c = map.getCenter();
  savePickup(c.lat, c.lng);
  setPlacing(false);
};

$("gpsBtn").onclick = () => {
  if (!navigator.geolocation) {
    banner("This browser cannot read your location. Choose a spot on the map instead.", "note", 7000);
    return;
  }
  if (location.protocol !== "https:" && location.hostname !== "localhost") {
    banner("Location only works over https. Open the site with an https link.", "note", 8000);
    return;
  }

  const btn = $("gpsBtn");
  btn.disabled = true;
  btn.textContent = "Finding you…";
  $("status").textContent = "Waiting for GPS. This can take a few seconds outdoors.";

  navigator.geolocation.getCurrentPosition(
    p => {
      btn.disabled = false;
      btn.textContent = "Send my current location";

      const acc = Math.round(p.coords.accuracy || 0);
      map.setView([p.coords.latitude, p.coords.longitude], 17);
      savePickup(p.coords.latitude, p.coords.longitude, acc);

      if (acc > 100) {
        banner("Your location is only accurate to about " + acc +
               " m. Tap “Choose a spot on the map” to correct it.", "note", 9000);
      }
    },
    e => {
      btn.disabled = false;
      btn.textContent = "Send my current location";
      $("status").textContent = "";

      let m;
      if (e.code === 1) m = "Location permission was refused. On iPhone: Settings → Safari → Location → Ask, then reload.";
      else if (e.code === 2) m = "Your phone could not get a GPS signal. Try going outside, or choose a spot on the map.";
      else if (e.code === 3) m = "Finding you took too long. Try again outdoors, or choose a spot on the map.";
      else m = "Could not get your location. Choose a spot on the map instead.";
      banner(m, "note", 10000);
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
};

function savePickup(lat, lng, accuracy) {
  const entry = {
    name: myName, phone: myPhone,
    lat: +lat.toFixed(6), lng: +lng.toFixed(6),
    status: "waiting",
    ts: firebase.database.ServerValue.TIMESTAMP
  };
  if (accuracy != null) entry.accuracy = accuracy;   // metres, GPS only

  db.ref("requests/" + myKey).set(entry)
    .then(() => banner(accuracy != null
        ? "Your location was sent. The driver can see you."
        : "Pickup requested. The driver has your location.", "info", 6000))
    .catch(e => banner("Could not send: " + e.message, "note", 7000));
}

$("cancelReq").onclick = () => {
  db.ref("requests/" + myKey).once("value").then(s => {
    const r = s.val();
    if (r) {
      db.ref("history").push({
        name: r.name || myName, phone: r.phone || myPhone,
        lat: r.lat, lng: r.lng,
        ts: r.ts || Date.now(),
        endedTs: firebase.database.ServerValue.TIMESTAMP,
        outcome: "cancelled",
        by: "passenger"
      }).catch(() => {});
    }
    return db.ref("requests/" + myKey).remove();
  })
  .then(() => banner("Request cancelled.", "info", 4000))
  .catch(e => banner("Could not cancel: " + e.message, "note", 6000));
};
</script>
</body>
</html>
